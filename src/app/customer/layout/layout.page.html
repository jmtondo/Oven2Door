<ion-header>
  <div class="announcement-bar">
    <span>🔥 20% OVEN 2 DOOR</span>
  </div>

  <nav class="main-header">
    <!-- LOGO AND MOBILE MENU -->
    <div class="logo-section">
      <button
        type="button"
        class="mobile-menu-btn"
        (click)="toggleMobileMenu()"
        aria-label="Toggle menu"
      >
        <ion-icon
          [name]="isMobileMenuOpen ? 'close-outline' : 'menu-outline'"
        ></ion-icon>
      </button>

      <div class="logo-container">
        <img
          src="assets/images/pizzapics/oven2doorlogo.png"
          alt="Oven2Door Logo"
          class="brand-logo-img"
        />
      </div>
    </div>

    <!-- DESKTOP NAVIGATION -->
    <div class="nav-links desktop-only">
      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        Home
      </a>

      <a routerLink="/menu" routerLinkActive="active" class="nav-item">
        Menu
      </a>

      <a
        routerLink="/order-tracking"
        routerLinkActive="active"
        class="nav-item"
      >
        Order Tracking
      </a>

      <a routerLink="/about-us" routerLinkActive="active" class="nav-item">
        About Us
      </a>

      <a routerLink="/faqs" routerLinkActive="active" class="nav-item">
        FAQS
      </a>
    </div>

    <!-- HEADER ACTIONS -->
    <div class="header-actions">
      <!-- DESKTOP PROFILE -->
      <button
        type="button"
        class="profile-btn desktop-only"
        aria-label="User profile"
        [routerLink]="isLoggedIn() ? '/profile' : '/login'"
      >
        <ion-icon name="person-outline"></ion-icon>

        <span *ngIf="isLoggedIn() && loggedInUserName()">
          Hi! {{ loggedInUserName() }}
        </span>
      </button>

      <!-- CART -->
      <button type="button" class="cart-btn" routerLink="/cart">
        <span class="cart-icon-wrapper">
          <ion-icon name="cart" class="cart-icon-orange"></ion-icon>

          <span class="cart-badge" *ngIf="storefront.itemCount > 0">
            {{ storefront.itemCount }}
          </span>
        </span>

        <span class="desktop-only"> CART </span>
      </button>

      <!-- ORDER NOW -->
      <button
        type="button"
        class="btn-order-now desktop-only"
        routerLink="/menu"
      >
        ORDER NOW
      </button>
    </div>
  </nav>

  <!-- MOBILE HAMBURGER MENU -->
  <div class="mobile-dropdown" [class.open]="isMobileMenuOpen">
    <!-- MAIN NAVIGATION -->
    <a
      class="mobile-nav-item"
      routerLink="/home"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
    >
      HOME
    </a>

    <a
      class="mobile-nav-item"
      routerLink="/menu"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
    >
      MENU
    </a>

    <a
      class="mobile-nav-item"
      routerLink="/order-tracking"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
    >
      ORDER TRACKING
    </a>

    <a
      class="mobile-nav-item"
      routerLink="/about-us"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
    >
      ABOUT US
    </a>

    <a
      class="mobile-nav-item"
      routerLink="/faqs"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
    >
      FAQS
    </a>

    <!-- LOGGED-IN CUSTOMER OPTIONS -->
    <ng-container *ngIf="isLoggedIn()">
      <a
        class="mobile-nav-item"
        routerLink="/profile"
        routerLinkActive="active"
        (click)="closeMobileMenu()"
      >
        MY ACCOUNT
      </a>

      <button type="button" class="mobile-nav-item" (click)="logout()">
        LOG OUT
      </button>
    </ng-container>

    <!-- GUEST CUSTOMER OPTIONS -->
    <ng-container *ngIf="!isLoggedIn()">
      <a
        class="mobile-nav-item"
        routerLink="/login"
        (click)="closeMobileMenu()"
      >
        LOG IN
      </a>

      <a
        class="mobile-nav-item"
        routerLink="/signup"
        (click)="closeMobileMenu()"
      >
        SIGN UP
      </a>
    </ng-container>

    <!-- MOBILE ORDER NOW -->
    <div class="mobile-action-wrapper">
      <button
        type="button"
        class="btn-order-now mobile-order-btn"
        routerLink="/menu"
        (click)="closeMobileMenu()"
      >
        ORDER NOW
      </button>
    </div>
  </div>
</ion-header>

<!-- CHILD PAGES -->
<ion-router-outlet></ion-router-outlet>
